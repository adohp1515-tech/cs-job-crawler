name: Daily 07:00 CS Job Crawler

on:
  schedule:
    # 매일 UTC 22:00 = 한국 시간(KST) 매일 오전 07:00
    - cron: '0 22 * * *'
  # GitHub 사이트에서 언제든 수동으로 즉시 실행할 수 있게 설정
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 3.10 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 크롤러 실행
        run: python collector.py
